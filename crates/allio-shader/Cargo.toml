[package]
name = "allio-shader"
version = "0.1.0"
edition = "2021"
description = "Screen region shaders: capture a region and redraw it through WGSL on the GPU"
authors = ["Orion Reed"]
license = "MIT"
repository = "https://github.com/folk-js/allio"
readme = "../../README.md"
keywords = ["shader", "screen-capture", "wgsl", "overlay"]
categories = ["graphics", "rendering"]

[lints]
workspace = true

[dependencies]
naga = { version = "30", default-features = false, features = ["wgsl-in", "msl-out"] }
serde = { version = "1", features = ["derive"] }
ts-rs = "10"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
log = "0.4"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
objc2-quartz-core = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-app-kit = "0.3.2"
parking_lot = "0.12"
objc2-core-graphics = { version = "0.3.2", features = ["CGEventTypes", "CGEventSource", "CGEvent"] }
