[package]
name = "allio-pointer"
version = "0.1.0"
edition = "2021"
description = "Pointer fields: reshape how real mouse motion moves the cursor (gain, sticky targets, portals)"
authors = ["Orion Reed"]
license = "MIT"
repository = "https://github.com/folk-js/allio"
readme = "../../README.md"
keywords = ["pointer", "cursor", "input", "overlay"]
categories = ["gui"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = "10"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
log = "0.4"
objc2-app-kit = { version = "0.3.2", features = ["NSBitmapImageRep", "NSCursor", "NSImage", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSDictionary", "NSGeometry"] }
parking_lot = "0.12"
objc2-core-foundation = { version = "0.3.2", features = ["CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", features = [
  "CGDirectDisplay",
  "CGError",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
] }
