<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame</title>
    <style>
      :root {
        --accent: #5b9bd5;
        --accent-glow: rgba(91, 155, 213, 0.3);
        --ok: #34d399;
        --warn: #fbbf24;
        --card-bg: rgba(28, 28, 30, 0.94);
        --border: rgba(255, 255, 255, 0.12);
      }

      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          sans-serif;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
        color: rgba(255, 255, 255, 0.92);
      }

      /* A card is an interactive, movable panel on the desktop canvas. */
      .card {
        position: absolute;
        min-width: 260px;
        max-width: 340px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(24px);
        pointer-events: auto;
        overflow: hidden;
        font-size: 13px;
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        cursor: grab;
        background: rgba(255, 255, 255, 0.03);
        border-bottom: 1px solid var(--border);
      }
      .card-header:active {
        cursor: grabbing;
      }
      .card-title {
        font-weight: 600;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
        flex: 0 0 auto;
        box-shadow: 0 0 8px currentColor;
      }
      .status-dot.linked {
        background: var(--ok);
        color: var(--ok);
      }
      .card-sub {
        font-size: 11px;
        opacity: 0.55;
        padding: 0 12px 8px;
      }

      .todo-list {
        list-style: none;
        margin: 0;
        padding: 6px 6px 10px;
        max-height: 420px;
        overflow-y: auto;
      }
      .todo-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 6px;
        border-radius: 6px;
      }
      .todo-row:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .todo-row input[type="checkbox"] {
        width: 15px;
        height: 15px;
        accent-color: var(--accent);
        flex: 0 0 auto;
      }
      .todo-row input[type="text"] {
        flex: 1;
        background: transparent;
        border: none;
        color: inherit;
        font: inherit;
        outline: none;
        padding: 2px 0;
      }
      .todo-row.done input[type="text"] {
        text-decoration: line-through;
        opacity: 0.5;
      }
      .empty {
        opacity: 0.4;
        font-size: 12px;
        padding: 10px 12px;
        text-align: center;
      }

      /* App / query picker */
      .picker {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
      }
      .picker label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        font-weight: 600;
        opacity: 0.6;
      }
      .picker select,
      .picker input {
        font: inherit;
        font-size: 12px;
        font-weight: 400;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        outline: none;
      }
      .picker select option {
        color: #000;
      }
      .picker-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }
      .card-btn {
        font: inherit;
        font-size: 12px;
        padding: 5px 12px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
        cursor: pointer;
      }
      .card-btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .card-header .card-btn {
        padding: 3px 8px;
        font-size: 11px;
      }

      /* Bottom-of-card connection nub, hints at wiring to the source window */
      .link-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 12px 12px;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 11px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
      }
      .link-pill:hover {
        border-color: var(--accent);
      }

      /* Window outline overlay - shows what the card is bound to */
      #windowOutline {
        position: absolute;
        border: 1.5px dashed var(--accent);
        border-radius: 6px;
        pointer-events: none;
        display: none;
        box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.001);
      }

      svg#wires {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }
      .wire {
        stroke: var(--accent);
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 6, 4;
        opacity: 0.7;
        animation: flow 0.5s linear infinite;
      }
      @keyframes flow {
        to {
          stroke-dashoffset: -10;
        }
      }
    </style>
  </head>
  <body>
    <svg id="wires"></svg>
    <div id="windowOutline"></div>
    <div id="cards"></div>
    <script type="module" src="../src/frame.ts"></script>
  </body>
</html>
